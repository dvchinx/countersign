spring:
  application:
    name: banking-agent
  threads:
    virtual:
      enabled: true          # a chat request may wait minutes for a human; don't hold a platform thread

management:
  endpoints:
    web:
      exposure:
        include: health, metrics

countersign:
  default-decision: deny     # fail closed: anything no policy allows is refused
  approval:
    timeout: 60s             # keep it below any HTTP timeout in front of /chat
  policies:
    - id: no-destructive-sql
      tools: ["db_*"]
      when: "#args['query'] matches '(?i).*\\b(drop|truncate|delete)\\b.*'"
      decision: deny
      reason: "Destructive SQL is not allowed from agents"
    - id: sql-reads
      tools: ["db_*"]
      when: "#args['query'] matches '(?is)\\s*select\\b.*'"
      decision: allow
    - id: transfers-need-approval
      tools: ["payments_transfer"]
      when: "#args['amount'] > 1000"
      decision: require-approval
      reason: "Transfers above $1,000 need a second person"
    - id: everyday-banking
      tools: ["accounts_balance", "payments_transfer", "support_open_ticket"]
      decision: allow
  # Redaction is not a decision: every rule that matches a call that runs applies, approved calls included.
  redactors:
    card-number:
      pattern: "\\b\\d(?:[ -]?\\d){12,18}\\b"    # 13 to 19 digits, with optional spaces or dashes
      replacement: "[CARD]"
  redactions:
    - id: no-card-numbers-to-the-helpdesk
      tools: ["support_open_ticket"]
      target: args                                # what the outside helpdesk receives
      redactors: [card-number]
    - id: no-card-numbers-to-the-model
      tools: ["*"]
      target: result                              # what the model gets back, from any tool
      redactors: [card-number]
