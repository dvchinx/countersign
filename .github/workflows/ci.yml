name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 21, Spring AI ${{ matrix.spring-ai }})
    runs-on: ubuntu-latest
    # The baseline, and the newest line Countersign supports on top of it (ADR 0013). The baseline run also tests
    # compat/spring-ai-2.1, which always uses 2.1.
    strategy:
      fail-fast: false
      matrix:
        spring-ai: ['2.0.2', '2.1.0']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Same command contributors run locally. Docker is available on ubuntu-latest for Testcontainers.
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress -Dspring-ai.version=${{ matrix.spring-ai }} verify
